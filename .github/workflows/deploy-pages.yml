name: Deploy Sheet-driven site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "main_site/**"
      - "scripts/**"
      - "tests/**"
  schedule:
    # Poll away from the top of the hour, when GitHub's schedule queue is busiest.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sheet-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build from Google Sheet
        run: >-
          python scripts/build_sheet_site.py
          --sheet-id 14pRbiM3ubsGT1DsBZdLF9xSHmSntwBRSkAUYbyrr6xM
          --output-dir _site

      - name: Validate generated site
        run: python scripts/validate_site.py _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
